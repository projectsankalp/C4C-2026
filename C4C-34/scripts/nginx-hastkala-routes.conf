# Shared route block, included from both HTTP :80 and HTTPS :443 server blocks.

# Vendor portal (plain static HTML/JS) at /vendor
location /vendor/ {
    alias /opt/hastkala/vendor-web/;
    try_files $uri $uri/ /vendor/index.html;
}
location = /vendor {
    return 301 /vendor/;
}

# API
location /api/ {
    proxy_pass         http://hastkala_api;
    proxy_http_version 1.1;
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   Upgrade $http_upgrade;
    proxy_set_header   Connection $connection_upgrade;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
}

# WhatsApp bot (QR + health publicly reachable; webhooks need bot secret)
location /wabot/ {
    proxy_pass         http://hastkala_wabot/;
    proxy_http_version 1.1;
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
}

location = /healthz {
    access_log off;
    return 200 "ok\n";
    add_header Content-Type text/plain;
}

# Static assets emitted by the TanStack Start client build.
# Serve directly from disk; never proxy them through the Node SSR.
location /assets/ {
    alias /opt/hastkala/web/dist/client/assets/;
    expires 7d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
}

# favicon, robots, manifest etc. that the client build may emit at /
location ~* ^/[^/]+\.(?:ico|png|svg|webp|woff2?|txt|json|webmanifest)$ {
    root /opt/hastkala/web/dist/client;
    try_files $uri @ssr;
    expires 1d;
}

# Everything else -> TanStack Start SSR
location @ssr {
    proxy_pass         http://hastkala_web;
    proxy_http_version 1.1;
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   Upgrade $http_upgrade;
    proxy_set_header   Connection $connection_upgrade;
}

location / {
    proxy_pass         http://hastkala_web;
    proxy_http_version 1.1;
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   Upgrade $http_upgrade;
    proxy_set_header   Connection $connection_upgrade;
}
