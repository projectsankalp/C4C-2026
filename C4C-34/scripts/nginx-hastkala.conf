# /etc/nginx/conf.d/hastkala.conf
# Front door for Hastkala. HTTP on :80, HTTPS on :443.
# HTTPS uses a Cloudflare Origin certificate. Cloudflare proxies in front,
# Full(strict) mode validates the origin chain.

client_max_body_size 25M;

upstream hastkala_web   { server 127.0.0.1:3000; keepalive 32; }
upstream hastkala_api   { server 127.0.0.1:5000; keepalive 32; }
upstream hastkala_wabot { server 127.0.0.1:5001; keepalive 16; }

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ---- Default catch-all: drop unknown Host headers ----
# Bot scans, vulnerability probes, and bare-IP traffic that doesn't match a
# real server_name return 444 (close connection without response). Keeps logs
# clean and reduces attack surface.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;

    server_name _;

    ssl_certificate     /etc/ssl/cyberkunju.com/cert.pem;
    ssl_certificate_key /etc/ssl/cyberkunju.com/key.pem;

    return 444;
}

# ---- Plain HTTP on cyberkunju.com — redirect to HTTPS ----
# Cloudflare's "Always Use HTTPS" handles this for users; we still redirect
# in case origin gets hit directly (cf-bypass) or HTTPS is the goal.
server {
    listen 80;
    listen [::]:80;
    server_name cyberkunju.com www.cyberkunju.com;
    return 301 https://$host$request_uri;
}

# ---- HTTPS (Cloudflare Origin cert) ----
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name cyberkunju.com www.cyberkunju.com;

    ssl_certificate     /etc/ssl/cyberkunju.com/cert.pem;
    ssl_certificate_key /etc/ssl/cyberkunju.com/key.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff"                              always;
    add_header X-Frame-Options           "SAMEORIGIN"                           always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"     always;
    add_header Permissions-Policy        "camera=(self), microphone=(self), geolocation=(self), payment=(self)" always;

    access_log /var/log/nginx/hastkala.access.log;
    error_log  /var/log/nginx/hastkala.error.log warn;

    include /etc/nginx/snippets/hastkala-routes.conf;
}
