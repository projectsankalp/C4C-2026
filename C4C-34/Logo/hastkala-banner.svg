<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 460" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="hk-title hk-desc">
  <title id="hk-title">HastKala — from a voice note to a livelihood</title>
  <desc id="hk-desc">A WhatsApp-first marketplace for India's women artisans.</desc>

  <defs>
    <!-- Loom-warp texture: many thin vertical threads in faded ink. -->
    <pattern id="warp" x="0" y="0" width="14" height="460" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="460" stroke="#1a1614" stroke-width="0.4" stroke-opacity="0.05"/>
    </pattern>

    <!-- Faint horizontal weft lines layered on top, slightly broken to feel hand-pulled. -->
    <pattern id="weft" x="0" y="0" width="6" height="6" patternUnits="userSpaceOnUse">
      <line x1="0" y1="3" x2="6" y2="3" stroke="#1a1614" stroke-width="0.25" stroke-opacity="0.04"/>
    </pattern>

    <!-- Clip path so the shuttle thread only travels inside the banner -->
    <clipPath id="band">
      <rect x="0" y="0" width="1600" height="460"/>
    </clipPath>

    <!-- Eased timing: slow start, slow end -->
  </defs>

  <!-- Cream paper / unbleached cotton ground -->
  <rect width="1600" height="460" fill="#fdfbf7"/>
  <rect width="1600" height="460" fill="url(#warp)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.8s" begin="0.2s" fill="freeze"/>
  </rect>
  <rect width="1600" height="460" fill="url(#weft)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.8s" begin="0.5s" fill="freeze"/>
  </rect>

  <!-- Top selvedge: vermilion thread drawn left-to-right -->
  <line x1="0" y1="1.5" x2="1600" y2="1.5" stroke="#df2227" stroke-width="3"
        stroke-dasharray="1600" stroke-dashoffset="1600">
    <animate attributeName="stroke-dashoffset" from="1600" to="0" dur="1.0s" begin="0s" fill="freeze"/>
  </line>

  <!-- Bottom selvedge: ink line + red thread drawn together -->
  <line x1="0" y1="455.5" x2="1600" y2="455.5" stroke="#1a1614" stroke-width="1.6" stroke-opacity="0.55"
        stroke-dasharray="1600" stroke-dashoffset="1600">
    <animate attributeName="stroke-dashoffset" from="1600" to="0" dur="1.0s" begin="0.4s" fill="freeze"/>
  </line>
  <line x1="0" y1="447.5" x2="1600" y2="447.5" stroke="#df2227" stroke-width="1.2" stroke-opacity="0.85"
        stroke-dasharray="1600" stroke-dashoffset="1600">
    <animate attributeName="stroke-dashoffset" from="1600" to="0" dur="1.0s" begin="0.55s" fill="freeze"/>
  </line>

  <!-- Decorative block-print squares, top-right corner -->
  <g transform="translate(1500, 38)" fill="#df2227" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="3.5s" fill="freeze"/>
    <rect x="0"  y="0"  width="14" height="14"/>
    <rect x="20" y="0"  width="14" height="14"/>
    <rect x="0"  y="20" width="14" height="14"/>
    <rect x="20" y="20" width="14" height="14">
      <!-- Subtle ongoing breathing on one corner square — life signal -->
      <animate attributeName="opacity" values="1;0.55;1" dur="3.5s" begin="4.5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Stamp line below the squares -->
  <text x="1554" y="92" text-anchor="end"
        font-family="'Fraunces', 'Cormorant Garamond', 'Times New Roman', serif"
        font-size="12" letter-spacing="3.4" fill="#1a1614" opacity="0">
    EST. WOMEN ARTISAN HOUSE
    <animate attributeName="opacity" from="0" to="0.55" dur="0.6s" begin="3.7s" fill="freeze"/>
  </text>

  <!-- ============================================================
       LEFT COLUMN — the mark, fades in in three layers like a stamp
       ============================================================ -->
  <g transform="translate(120, 80) scale(0.236)">
    <!-- Cream petals (background of the logo) -->
    <g fill="#fdfbf7" stroke="#1a1614" stroke-width="2.4" stroke-opacity="0.18" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.7s" begin="0.9s" fill="freeze"/>
      <path d="M554.89 963.94 c34.66 -8.94 60.12 -35.28 69.44 -71.80 4.35 -17.14 5.59 -35.90 5.22 -76.64 l-0.37 -36.02 -40.62 -0.37 -40.74 -0.25 -0.12 46.83 c-0.12 62.36 -1.24 87.45 -4.72 100.87 -3.35 12.92 -8.20 23.48 -15.03 33.66 l-5.34 7.83 11.30 -0.87 c6.21 -0.50 15.65 -1.99 20.99 -3.23z m261.23 2.98 c0 -0.37 -1.74 -2.86 -3.73 -5.47 -5.09 -6.46 -11.55 -20.74 -15.03 -33.54 l-2.98 -10.56 -0.37 -166.70 -0.37 -166.83 -40.99 0 -40.99 0 0.50 146.95 c0.37 145.46 0.37 146.95 3.11 157.63 5.47 22.36 14.91 39.25 29.69 53.17 9.81 9.44 16.02 13.29 29.56 18.63 12.30 4.84 41.61 9.56 41.61 6.71z m-496.13 -208.81 c4.84 -2.24 13.17 -5.34 18.63 -6.83 l9.81 -2.86 167.20 -0.37 167.20 -0.25 0.75 -10.31 c1.12 -13.29 1.12 -61.61 0.12 -71.55 l-0.87 -7.58 -147.32 0 c-140.74 0 -147.82 0.12 -158.13 2.48 -38.38 8.45 -67.57 37.64 -78.01 77.76 -2.48 9.94 -5.09 30.81 -4.10 33.66 0.37 0.75 3.73 -0.99 8.20 -4.35 4.22 -3.23 11.68 -7.70 16.52 -9.81z m723.57 -1.74 c-5.09 -48.20 -30.93 -81.49 -73.66 -94.53 -8.82 -2.73 -10.81 -2.73 -78.26 -3.23 l-69.31 -0.37 0 44.84 0 44.72 80.62 0 c65.21 0 82.48 0.37 90.93 1.86 17.39 2.98 32.67 9.19 44.10 17.89 3.35 2.61 6.34 4.10 6.58 3.48 0.25 -0.62 -0.25 -7.20 -0.99 -14.66z m-414.15 -278.37 c-0.37 -139.25 -0.62 -151.42 -2.61 -159.99 -9.19 -38.76 -28.45 -63.35 -59.13 -75.65 -10.93 -4.35 -28.57 -7.83 -36.64 -7.33 l-5.59 0.37 4.97 7.45 c5.71 8.70 11.30 23.35 14.53 38.01 1.99 9.69 2.24 21.86 2.36 170.06 0.12 87.82 0.37 163.72 0.37 168.69 l0.12 8.94 40.99 0 41.12 0 -0.50 -150.55z m-109.56 30.68 l0 -44.72 -88.20 -0.62 -88.20 -0.62 -11.18 -3.48 c-13.42 -4.22 -24.10 -9.44 -31.55 -15.53 l-5.47 -4.47 0.75 10.68 c3.23 41.36 21.37 72.30 52.42 89.81 9.94 5.59 28.32 11.68 39.38 12.92 4.97 0.62 36.77 0.99 70.56 0.87 l61.49 -0.12 0 -44.72z m443.83 41.86 c45.22 -12.05 73.66 -45.59 79.62 -94.03 2.24 -18.26 2.48 -17.64 -5.09 -11.93 -8.82 6.46 -17.39 10.56 -30.43 14.66 l-10.93 3.35 -111.80 0.87 c-61.49 0.50 -137.63 0.87 -169.19 0.99 l-57.39 0.12 -0.37 33.29 c-0.25 18.26 -0.25 38.38 0 44.72 l0.37 11.55 147.45 -0.50 147.45 -0.37 10.31 -2.73z m-169.81 -190.30 c0.62 -64.47 0.99 -75.15 2.86 -83.23 3.23 -13.54 8.82 -27.20 14.53 -35.40 2.73 -3.85 4.84 -7.20 4.60 -7.45 -0.25 -0.12 -5.09 0.25 -10.81 0.75 -41.86 4.22 -72.54 28.32 -86.08 67.57 -6.21 18.01 -7.20 29.69 -7.20 82.73 0 26.33 0.37 48.32 0.87 48.69 0.50 0.50 18.76 0.75 40.62 0.62 l39.87 -0.37 0.75 -73.91z"/>
    </g>

    <!-- Black structural strokes — ink, stamped second -->
    <g fill="#1a1614" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="1.4s" fill="freeze"/>
      <path d="M513.02 970.52 c0 -0.62 1.49 -2.48 3.23 -4.22 4.72 -4.35 12.67 -16.40 16.77 -25.34 9.19 -20.50 10.81 -37.51 10.93 -119 l0.12 -46.83 44.47 0.25 44.35 0.37 0.37 39.75 c0.12 21.86 -0.25 46.21 -0.99 54.16 -4.60 52.42 -30.43 86.70 -74.03 98.13 -10.93 2.86 -45.22 4.97 -45.22 2.73z"/>
      <path d="M791.27 969.53 c-11.18 -1.74 -26.21 -7.08 -35.90 -12.79 -7.95 -4.60 -21.86 -18.14 -27.83 -26.83 -6.58 -9.69 -12.79 -24.22 -16.02 -37.76 -2.73 -10.68 -2.73 -12.05 -3.11 -161.36 l-0.50 -150.68 44.72 0 44.72 0 0.37 166.83 0.37 166.70 2.98 10.56 c3.97 14.41 10.93 28.94 18.51 38.14 3.48 4.10 5.96 7.95 5.59 8.32 -1.37 1.24 -22.98 0.62 -33.91 -1.12z"/>
      <path d="M291.54 777.61 c-1.12 -9.69 0.99 -30.68 4.22 -42.98 10.43 -40 39.63 -69.07 77.89 -77.51 10.06 -2.24 16.52 -2.48 92.17 -2.48 l81.36 0 0 48.45 0 48.32 -97.51 0.37 c-96.39 0.37 -97.64 0.50 -107.45 3.23 -15.53 4.22 -31.18 12.55 -41.24 21.86 l-8.70 8.07 -0.75 -7.33z"/>
      <path d="M1042.20 777.98 c-6.21 -6.21 -19.25 -14.41 -28.69 -18.14 -19.50 -7.70 -16.40 -7.58 -109.44 -7.95 l-85.46 -0.50 0 -48.45 0 -48.45 73.04 0.37 c71.43 0.50 73.16 0.50 81.98 3.23 34.78 10.56 59 35.28 69.07 70.18 4.60 15.90 7.08 43.35 4.72 51.30 -0.87 2.48 -1.12 2.48 -5.22 -1.61z"/>
      <path d="M543.95 623.58 c-0.12 -5.09 -0.25 -81.11 -0.37 -168.94 -0.12 -149.06 -0.25 -160.37 -2.36 -170.06 -4.60 -20.99 -11.80 -36.64 -22.48 -48.20 l-4.84 -5.34 3.60 -0.12 c61.36 -2.86 100.62 26.46 113.16 84.59 2.11 9.94 2.24 20 2.24 163.72 l0 153.16 -44.47 0.25 -44.35 0.25 -0.12 -9.32z"/>
      <path d="M384.08 556.38 c-11.06 -1.24 -29.44 -7.33 -39.38 -12.92 -25.96 -14.53 -42.73 -38.38 -49.81 -70.80 -2.11 -9.19 -3.97 -41.61 -2.48 -41.61 0.50 0 4.60 2.98 9.19 6.71 10.19 8.20 19.88 13.17 34.41 17.76 l11.18 3.48 88.20 0.62 88.20 0.62 0 48.45 0 48.45 -65.21 0.12 c-35.90 0.12 -69.31 -0.25 -74.28 -0.87z"/>
      <path d="M793.51 509.67 c-0.25 -26.46 -0.25 -48.45 0 -48.82 0.25 -0.37 45.22 -0.87 100 -1.24 l99.62 -0.62 11.18 -3.48 c14.66 -4.60 26.09 -10.81 35.15 -19.01 4.10 -3.73 7.83 -6.71 8.20 -6.71 1.24 0 0.87 18.51 -0.62 30.43 -5.96 48.45 -34.53 82.23 -79.62 94.03 -9.94 2.61 -12.79 2.73 -91.92 3.11 l-81.61 0.50 -0.37 -48.20z"/>
      <path d="M708.92 437.62 c-0.50 -0.37 -0.87 -23.97 -0.87 -52.42 0 -57.02 0.99 -68.20 7.20 -86.46 11.18 -32.42 34.78 -55.28 66.21 -63.97 10.81 -2.98 33.29 -5.47 39.75 -4.35 l4.72 0.87 -5.47 6.58 c-7.08 8.70 -10.93 15.53 -14.78 25.59 -7.20 19.25 -7.33 20.50 -8.07 100.49 l-0.75 73.91 -43.60 0.37 c-23.97 0.12 -43.85 -0.12 -44.35 -0.62z"/>
    </g>

    <!-- Vermilion accent squares — last to land, the heart of the mark.
         Tiny scale-pop animation gives them the feeling of a final stamp. -->
    <g fill="#df2227" transform-origin="671 600" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="2.0s" fill="freeze"/>
      <animateTransform attributeName="transform" type="scale" additive="sum"
                        values="0.85;1.06;1" keyTimes="0;0.6;1" dur="0.55s" begin="2.0s" fill="freeze"/>
      <path d="M543.21 703.45 l0.25 -48.20 71.55 -0.37 71.55 -0.25 0.87 7.58 c0.99 9.94 0.99 65.71 -0.12 79.13 l-0.75 10.19 -71.80 0 -71.67 0 0.12 -48.07z"/>
      <path d="M654.26 556.87 c-0.25 -0.62 -0.37 -11.93 -0.25 -25.22 0.12 -13.29 0.37 -34.66 0.50 -47.58 l0.12 -23.23 71.18 0.25 71.05 0.37 0.37 48.20 0.25 48.07 -71.30 0 c-39.25 0 -71.67 -0.37 -71.92 -0.87z"/>

      <!-- Continuous heartbeat on the mark's center, very subtle -->
      <animate attributeName="opacity" values="1;0.78;1" keyTimes="0;0.5;1"
               dur="4s" begin="3.5s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- Vertical loom thread separating the mark from the wordmark.
       Drawn downward like setting up the loom. -->
  <line x1="476" y1="92" x2="476" y2="368" stroke="#1a1614" stroke-width="0.6" stroke-opacity="0.35"
        stroke-dasharray="280" stroke-dashoffset="280">
    <animate attributeName="stroke-dashoffset" from="280" to="0" dur="0.9s" begin="2.0s" fill="freeze"/>
  </line>

  <!-- ============================================================
       RIGHT COLUMN — the wordmark, fades in like ink on paper
       ============================================================ -->

  <!-- Devanagari name -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.7s" begin="2.3s" fill="freeze"/>
    <text x="540" y="180"
          font-family="'Noto Serif Devanagari', 'Tiro Devanagari Hindi', 'Mangal', serif"
          font-size="92" font-weight="500" fill="#1a1614">
      हस्तकला
    </text>
  </g>

  <!-- Latin etched-title wordmark -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="2.7s" fill="freeze"/>
    <text x="540" y="248"
          font-family="'Fraunces', 'Cormorant Garamond', 'Playfair Display', 'Times New Roman', serif"
          font-size="34" font-weight="600" letter-spacing="14" fill="#1a1614">
      HAST<tspan dx="6" dy="-2" fill="#df2227">·</tspan><tspan dx="6" dy="2" fill="#1a1614">KALA</tspan>
    </text>
  </g>

  <!-- Tagline -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="0.85" dur="0.7s" begin="3.0s" fill="freeze"/>
    <text x="540" y="298"
          font-family="'Fraunces', 'Cormorant Garamond', 'Playfair Display', 'Times New Roman', serif"
          font-style="italic" font-size="22" fill="#1a1614">
      From a voice note to a livelihood.
    </text>
  </g>

  <!-- Provenance line -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="0.55" dur="0.7s" begin="3.4s" fill="freeze"/>
    <text x="540" y="378"
          font-family="'Fraunces', 'Cormorant Garamond', 'Times New Roman', serif"
          font-size="11" letter-spacing="3.6" fill="#1a1614">
      HAND-WOVEN  ·  WHATSAPP-FIRST  ·  FIVE INDIAN LANGUAGES  ·  MADE WITH HANDS, IN INDIA
    </text>
  </g>

  <!-- Tiny block-print square at the start of the provenance line -->
  <rect x="510" y="368" width="6" height="6" fill="#df2227" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="3.4s" fill="freeze"/>
  </rect>

  <!-- ============================================================
       Continuous shuttle thread — the weaver is still at the loom.
       A small red thread sweeps across the band every 9 seconds.
       Lives inside the band clip so it never escapes the cotton.
       ============================================================ -->
  <g clip-path="url(#band)">
    <line x1="-60" y1="227" x2="40" y2="227" stroke="#df2227" stroke-width="0.9" stroke-opacity="0">
      <!-- Hold off until the static composition is fully in place -->
      <animate attributeName="stroke-opacity" values="0;0.55;0" keyTimes="0;0.5;1"
               dur="3.0s" begin="5s; shuttle.end+6s" id="shuttle"/>
      <animateTransform attributeName="transform" type="translate"
                        from="0 0" to="1700 0" dur="3.0s" begin="5s; shuttle.end+6s"/>
    </line>
  </g>

</svg>
