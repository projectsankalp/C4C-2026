  <style>
    /* Sleek, tiny 'New' indicator */
    .new-tag {
      position: absolute;
      top: 18px;
      right: 18px;
      background-color: rgba(255, 71, 87, 0.9);
      backdrop-filter: blur(4px);
      color: white;
      font-size: 10px;

      text-transform: uppercase;

      display: flex;
      align-items: center;
      gap: 6px;
    }

      content: '';
      display: block;
      width: 6px;
      height: 6px;
      background-color: white;
      border-radius: 50%;
      animation: pulse-dot 1.5s infinite;
    }

    @keyframes pulse-dot {
      0% {
        transform: scale(0.8);
        opacity: 1;
      }

      100% {
        transform: scale(1.8);
        opacity: 0;
      }

  <script>
    /* ===========================
       Input icon toggle & send flow
       Replace your existing mic/send and sending script with this
       =========================== */

    /* DOM refs */
    const chatInput = document.querySelector('.chatbox');
    const micIcon = document.querySelector('.mic-icon');
    const sendIcon = document.querySelector('.send-icon');
    const sendBtn = document.getElementById('sendBtn');

    /* Show/hide icons while typing */
    if (chatInput) {
      chatInput.addEventListener('input', () => {
        const hasText = chatInput.value.trim().length > 0;
        if (micIcon) micIcon.style.display = hasText ? 'none' : 'inline-block';
        if (sendIcon) sendIcon.style.display = hasText ? 'inline-block' : 'none';
      });
    }

    /* Helper to restore icons after sending (when input is empty) */
    function resetIconsAfterSend() {
      if (!chatInput) return;
      const empty = chatInput.value.trim().length === 0;
      if (empty) {
        if (micIcon) micIcon.style.display = 'inline-block';
        if (sendIcon) sendIcon.style.display = 'none';
      } else {
        if (micIcon) micIcon.style.display = 'none';
        if (sendIcon) sendIcon.style.display = 'inline-block';
      }
    }

    /* Sidebar Actions */
    function startNewChat() {
      const messagesContainer = document.querySelector('.ai-response-messages');
      if (messagesContainer) {
        messagesContainer.innerHTML = '<div class="ai-response-placeholder" style="color:var(--muted,#bdbdbd);font-size:13px">No messages yet</div>';
      }
      historyStore = [];
      localStorage.removeItem('mascot_chatHistory');
    }
    
    function openPastChats() {
      const sidebar = document.getElementById('pastChatsSidebar');
      if (sidebar) {
        sidebar.classList.toggle('open');
      }
    }

    /* ====== AI API Configuration ====== */
    /* Groq API — using key from .env.local */
    const GROQ_API_KEY = 'YOUR_GROQ_API_KEY_HERE';
    const GROQ_ENDPOINT = 'https://api.groq.com/openai/v1/chat/completions';

    // Best model for conversational speech & text (high quality, fast)
    const GROQ_CHAT_MODEL = 'llama-3.3-70b-versatile';
    // Best model for image/vision context analysis (multimodal)
    const GROQ_VISION_MODEL = 'meta-llama/llama-4-scout-17b-16e-instruct';

    /* HuggingFace — Image Generation (key rotation for rate limits) */
    const HF_API_KEYS = [
      'YOUR_HF_API_KEY_HERE','YOUR_HF_API_KEY_HERE',
      'YOUR_HF_API_KEY_HERE','YOUR_HF_API_KEY_HERE',
      'YOUR_HF_API_KEY_HERE','YOUR_HF_API_KEY_HERE',
      'YOUR_HF_API_KEY_HERE','YOUR_HF_API_KEY_HERE',
      'YOUR_HF_API_KEY_HERE','YOUR_HF_API_KEY_HERE',
      'YOUR_HF_API_KEY_HERE','YOUR_HF_API_KEY_HERE',
      'YOUR_HF_API_KEY_HERE'
    ];
    let hfKeyIndex = 0;
    function getNextHFKey() {
      const key = HF_API_KEYS[hfKeyIndex % HF_API_KEYS.length];
      hfKeyIndex++;
      return key;
    }

    const HF_IMAGE_MODEL = 'black-forest-labs/FLUX.1-schnell';

    /* Call Groq Chat Completions (standard OpenAI-compatible format) */
    async function callGroqChat(userMessage, model = GROQ_CHAT_MODEL) {
      const resp = await fetch(GROQ_ENDPOINT, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${GROQ_API_KEY}`
        },
        body: JSON.stringify({
          model: model,
          messages: [
            { role: 'user', content: userMessage }
          ],
          max_tokens: 1024
        })
      });
      if (!resp.ok) {
        const errText = await resp.text().catch(() => null);
        throw new Error(`Groq HTTP ${resp.status}${errText ? ': ' + errText : ''}`);
      }
      const json = await resp.json();
      // Standard OpenAI format: choices[0].message.content
      return json.choices?.[0]?.message?.content || '';
    }

    /* Call Groq Vision for image context analysis */
    async function callGroqVision(imageBase64, prompt = 'Describe this image in detail.') {
      const resp = await fetch(GROQ_ENDPOINT, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${GROQ_API_KEY}`
        },
        body: JSON.stringify({
          model: GROQ_VISION_MODEL,
          messages: [
            {
              role: 'user',
              content: [
                { type: 'text', text: prompt },
                { type: 'image_url', image_url: { url: `data:image/jpeg;base64,${imageBase64}` } }
              ]
            }
          ],
          max_tokens: 1024
        })
      });
      if (!resp.ok) {
        const errText = await resp.text().catch(() => null);
        throw new Error(`Vision HTTP ${resp.status}${errText ? ': ' + errText : ''}`);
      }
      const json = await resp.json();
      return json.choices?.[0]?.message?.content || '';
    }

    /* HuggingFace Image Generation */
    async function generateImageHF(prompt) {
      const key = getNextHFKey();
      const resp = await fetch(`https://api-inference.huggingface.co/models/${HF_IMAGE_MODEL}`, {
        method: 'POST',
        headers: {
          'Authorization': `Bearer ${key}`,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({ inputs: prompt })
      });
      if (!resp.ok) {
        throw new Error(`HF Image Gen failed (${resp.status})`);
      }
      const blob = await resp.blob();
      return URL.createObjectURL(blob);
    }

    /* safe escape */
    function escapeHtml(s) {
      if (s == null) return '';
      return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
    }

    /* formatting helper (simple) */
    function formatAIText(raw) {
      if (!raw) return '';
      raw = raw.replace(/\/n/g, '\n'); // support /n
      let txt = escapeHtml(raw);
      txt = convertTables(txt);
      txt = txt.replace(/^###\s*(.+)$/gim, '<div class="ai-h3">$1</div>');
      txt = txt.replace(/^##\s*(.+)$/gim, '<div class="ai-h3">$1</div>');
      txt = txt.replace(/^#\s*(.+)$/gim, '<div class="ai-h2">$1</div>');
      txt = txt.replace(/\*\*(.+?)\*\*/g, '<span class="ai-strong">$1</span>');
      txt = txt.replace(/`(.+?)`/g, '<span class="ai-code">$1</span>');
      txt = convertLists(txt);
      txt = txt.replace(/\n/g, '<br>');

      // Smart Component Routing Parser
      const linkRegex = /\[LINK:\s*([\w.-]+)\s*\|\s*Text:\s*([^\]]+)\]/g;
      txt = txt.replace(linkRegex, function(match, url, text) {
          let imageUrl = 'essentials/slogo-dark.png'; // default
          if(url.includes('breathing')) imageUrl = 'essentials/anxiety.jpg';
          if(url.includes('journal')) imageUrl = 'essentials/jurnal.png';
          if(url.includes('calm') || url.includes('stress')) imageUrl = 'essentials/game.png';
          if(url.includes('screening')) imageUrl = 'essentials/self scrning.jpg';
          if(url.includes('community')) imageUrl = 'essentials/chat.png';
          if(url.includes('doctor') || url.includes('mri')) imageUrl = 'essentials/dr.jpg';
          
          return `
            <div style="display: flex; align-items: center; border-radius: 10px; background: #fae5d3; border: 1px solid #e8cbb9; max-width: 250px; padding: 6px 10px; margin-top: 10px; box-shadow: 0 2px 6px rgba(0,0,0,0.05); text-align: left; clear: both;">
                <img src="${imageUrl}" alt="Icon" style="width: 32px; height: 32px; object-fit: cover; border-radius: 6px; margin-right: 10px; flex-shrink: 0;">
                <div style="flex: 1; min-width: 0;">
                    <div style="font-size: 0.75rem; color: #5c433b; margin: 0 0 2px 0; font-weight: 700; line-height: 1.2;">Suggested Tool</div>
                    <a href="${url}" style="font-size: 0.7rem; background: #eabfa6; color: #4a3026; text-decoration: none; padding: 2px 8px; border-radius: 8px; font-weight: 600; display: inline-flex; align-items: center; gap: 2px;">
                        ${text} <i class="material-symbols-outlined" style="font-size: 12px;">arrow_forward</i>
                    </a>
                </div>
            </div>
          `;
      });

      return txt;
    }

    function convertTables(text) {
      const lines = text.split('\n');
      let out = [], i = 0;
      while (i < lines.length) {
        const line = lines[i], next = lines[i + 1] || '';
        if (line.includes('|') && (/^\s*[:\-\s|]+\s*$/.test(next))) {
          const headers = line.split('|').map(s => s.trim()).filter(Boolean);
          i += 2;
          const rows = [];
          while (i < lines.length && lines[i].includes('|')) {
            rows.push(lines[i].split('|').map(s => s.trim()).filter(Boolean));
            i++;
          }
          let tbl = '<table class="ai-table"><thead><tr>';
          headers.forEach(h => tbl += `<th>${h}</th>`);
          tbl += '</tr></thead><tbody>';
          rows.forEach(r => {
            tbl += '<tr>';
            headers.forEach((_, idx) => tbl += `<td>${escapeHtml(r[idx] || '')}</td>`);
            tbl += '</tr>';
          });
          tbl += '</tbody></table>';
          out.push(tbl);
        } else {
          out.push(line);
          i++;
        }
      }
      return out.join('\n');
    }

    function convertLists(text) {
      const lines = text.split('\n');
      let out = [], inList = false, buf = [];
      for (const ln of lines) {
        const m = ln.match(/^\s*[-*]\s+(.+)$/);
        if (m) { inList = true; buf.push(`<li>${m[1]}</li>`); }
        else {
          if (inList) { out.push('<ul class="ai-list">' + buf.join('') + '</ul>'); buf = []; inList = false; }
          out.push(ln);
        }
      }
      if (inList) out.push('<ul class="ai-list">' + buf.join('') + '</ul>');
      return out.join('\n');
    }

    /* Robust recursive extractor: skip objects/fields that look like "reasoning" */
    function extractBestText(node) {
      if (!node && node !== 0) return '';
      if (typeof node === 'string') return node.trim();
      if (typeof node === 'number' || typeof node === 'boolean') return String(node);

      if (Array.isArray(node)) {
        // prefer first element that yields non-empty text
        for (const el of node) {
          const res = extractBestText(el);
          if (res) return res;
        }
        return '';
      }

      if (typeof node === 'object') {
        if (node.type && /reason/i.test(String(node.type))) return '';
        if (node.role && /reason/i.test(String(node.role))) return '';
        if (typeof node.output_text === 'string' && node.output_text.trim()) return node.output_text.trim();
        if (typeof node.text === 'string' && node.text.trim()) return node.text.trim();
        if (typeof node.content === 'string' && node.content.trim()) return node.content.trim();
        if (typeof node.message === 'string' && node.message.trim()) return node.message.trim();
        if (typeof node.answer === 'string' && node.answer.trim()) return node.answer.trim();

        if (node.content && typeof node.content === 'object') {
          const c = extractBestText(node.content);
          if (c) return c;
        }

        if (Array.isArray(node.output) && node.output.length) {
          for (const el of node.output) {
            if (el && typeof el === 'object' && /reason/i.test(String(el.type || el.role || ''))) continue;
            const r = extractBestText(el);
            if (r) return r;
          }
        }

        for (const k of Object.keys(node)) {
          if (/reason/i.test(k)) continue;
          const r = extractBestText(node[k]);
          if (r) return r;
        }
      }
      return '';
    }

    /* Create or return popup container */
    function createOrGetPopup() {
      let popup = document.querySelector('.ai-response-popup');
      if (popup) return popup;

      const inputbar = document.querySelector('.inputbar');
      popup = document.createElement('div');
      popup.className = 'ai-response-popup show';
      popup.innerHTML = `
    <div class="ai-response-messages">
      <div class="ai-response-placeholder" style="color:var(--muted,#bdbdbd);font-size:13px">No messages yet</div>
    </div>
  `;
      inputbar.parentNode.insertBefore(popup, inputbar);
      return popup;
    }

    function setPopupLoading(popup, loading = true) {
      const header = popup.querySelector('.ai-response-model');
      if (header) {
        if (loading) header.innerHTML = `<small style="opacity:.7;font-weight:400; padding-left:10px;">thinking...</small><span class="ai-loader" aria-hidden="true"><span></span><span></span><span></span></span>`;
        else header.innerHTML = '     ';
      }
    }

    function appendUserBubble(container, userText) {
      const user = document.createElement('div');
      user.className = 'ai-user';
      user.textContent = userText;  // only show typed text
      container.appendChild(user);
      container.scrollTop = container.scrollHeight;
      return user;
    }

    function appendAssistantPlaceholder(container) {
      const a = document.createElement('div');
      a.className = 'ai-assistant';
      a.innerHTML = `<em>Thinking...</em> <span class="ai-loader" aria-hidden="true"><span></span><span></span><span></span></span>`;
      container.appendChild(a);
      container.scrollTop = container.scrollHeight;
      return a;
    }

    /* Main flow: show user bubble, placeholder, then replace placeholder with extracted assistant text (no reasoning) */
    const API_URL = "http://localhost:5050";
    let historyStore = JSON.parse(localStorage.getItem('mascot_chatHistory')) || [];
    let sending = false;
    let attachedImages = [];

    // --- Speech Synthesis Engine (Matching RAG2.0) ---
    let synth = window.speechSynthesis;
    let voicesList = [];
    let defaultVoiceIndex = -1;

    function loadVoices() {
      if (!synth) return;
      voicesList = synth.getVoices();
      
      // Try to find a comforting male voice or fallback to default English
      voicesList.forEach((voice, i) => {
        const nameLower = voice.name.toLowerCase();
        if (defaultVoiceIndex === -1 && (
            nameLower.includes("david") ||
            nameLower.includes("male") ||
            nameLower.includes("guy") ||
            nameLower.includes("natural") ||
            nameLower.includes("google us english")
        )) {
            defaultVoiceIndex = i;
        }
      });
      if (defaultVoiceIndex === -1) {
          defaultVoiceIndex = voicesList.findIndex(v => v.lang.startsWith("en"));
      }
    }

    if (synth && synth.onvoiceschanged !== undefined) {
      synth.onvoiceschanged = loadVoices;
    }
    loadVoices();

    function speakAnswer(text) {
      if (!synth) return;
      synth.cancel(); // Cancel current speech
      const cleanText = text.replace(/[*#_`>]/g, "").replace(/\n+/g, " ");
      const utterance = new SpeechSynthesisUtterance(cleanText);
      
      if (voicesList.length > 0 && defaultVoiceIndex !== -1) {
          utterance.voice = voicesList[defaultVoiceIndex];
      }
      
      synth.speak(utterance);
    }
    // ------------------------------------------------

    // Restore chat history on load if any
    document.addEventListener("DOMContentLoaded", () => {
      if (historyStore.length > 0) {
        const popup = createOrGetPopup();
        const messagesContainer = popup.querySelector('.ai-response-messages');
        messagesContainer.querySelectorAll('.ai-response-placeholder').forEach(n => n.remove());

          messagesContainer.appendChild(assistant);
        });
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
      }
    });

      // Get user nickname/identity dynamically for RAG namespace matching
      const userString = localStorage.getItem('mentalHealth_currentUser');
      let userId = "1";
      if (userString) {

        } catch (e) {}
      }
      const namespace = `user_${userId}_mental_health`;

      try {
        // Build a short context string
        const systemPrompt = `You are "Mentai Coach," an empathetic, culturally aware, and safe AI Mental Health Companion designed for the Indian population. Your primary goal is to provide stigma-free, anonymous emotional support.

### 1. CORE PERSONALITY & TONE:

### 3. STRICT COMPONENT ROUTING:
IMPORTANT: ONLY suggest a tool IF AND ONLY IF the user expresses a direct need for it (e.g., they specifically say they are panicked, lonely, or want to play a game). DO NOT append links to general conversation, greetings, or casual talk.
If no tool is relevant, do NOT output any placeholders, comments, brackets, or notes like "[No tool suggested]". Simply reply with the natural message.
If they do need a tool, append exactly ONE of these at the end:
- Panicked/Hyperventilating -> [LINK: breathing.html | Text: Guided Breathing]
- Sad/Want to write -> [LINK: journal.html | Text: Open Journal]
- Stressed/Want distraction -> [LINK: calm.html | Text: Mini-Games]
- Need a real therapist -> [LINK: doctor.html | Text: Find a Therapist]
- Feel isolated/need peers -> [LINK: community.html | Text: Community Chat]

### 4. RESPONSE FORMATTING:
- Keep text extremely short (1-2 sentences). Do not ramble.
- If you append a link, put it at the very bottom.

User Question: ${text}`;
        
        // Fetch response directly from Groq using the native client
        let extracted;
        if (attachedImages.length > 0) {
          const base64Data = attachedImages[0].base64;
          extracted = await callGroqVision(base64Data, systemPrompt);
          
          // Reset attached files

        } else {
          extracted = await callGroqChat(systemPrompt);
        }

        // Save conversation history

        });

        if (historyStore.length > 5) {
          historyStore.shift();
        }
        localStorage.setItem('mascot_chatHistory', JSON.stringify(historyStore));

        // Render assistant content (formatted)
        assistantPlaceholder.innerHTML = formatAIText(extracted);
        setPopupLoading(popup, false);

        // Auto-read response via TTS
        speakAnswer(extracted);
      } catch (err) {
        assistantPlaceholder.innerHTML = `<div class="ai-response-error" style="color: #ff4757; font-weight: 500;">Connection to AI failed: ${escapeHtml(err.message || err)}</div>`;
        setPopupLoading(popup, false);
        console.error('Groq call error', err);
      } finally {
        sending = false;
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
        resetIconsAfterSend();
      }
    }

    /* Hook Enter (no Shift) and Send button ÃƒÆ’Ã‚Â¢ÃƒÂ¢Ã¢â‚¬Å¡Ã‚Â¬ÃƒÂ¢Ã¢â€šÂ¬Ã‚Â ensures mic returns after clearing input */
    (function attachEnterToSend() {

      ta.addEventListener('keydown', (ev) => {
        if (ev.key === 'Enter' && !ev.shiftKey) {

            resetIconsAfterSend();

          }
          // clear textarea BEFORE sending (you already did this pattern)
          ta.value = '';

  <script>
    // Apply saved theme on page load
    document.addEventListener("DOMContentLoaded", () => {
      const savedTheme = localStorage.getItem("theme");
      const body = document.body;
      const icon = document.getElementById("theme-icon");
      const logos = document.querySelectorAll(".theme-logo");

      function updateLogos(theme) {
        logos.forEach(logo => {
          const darkSrc = logo.getAttribute("data-dark");
          const lightSrc = logo.getAttribute("data-light");
          logo.src = theme === "light" ? lightSrc : darkSrc;
        });
      }

      if (savedTheme === "light") {
        body.classList.remove("dark");
        if (icon) icon.textContent = "dark_mode";
        updateLogos("light");
      } else {
        body.classList.add("dark");
        if (icon) icon.textContent = "wb_sunny";
        updateLogos("dark");
      }
    });

    // Toggle and save theme
    function toggleDarkMode() {
      const body = document.body;
      const icon = document.getElementById("theme-icon");

      if (body.classList.contains("dark")) {
        body.classList.remove("dark");
        if (icon) icon.textContent = "dark_mode";
        localStorage.setItem("theme", "light");
        updateLogos("light");
      } else {
        body.classList.add("dark");
        if (icon) icon.textContent = "wb_sunny";
        localStorage.setItem("theme", "dark");
        updateLogos("dark");
      }
    }

    // Shared function to update logos
    function updateLogos(theme) {
      document.querySelectorAll(".theme-logo").forEach(logo => {
        const darkSrc = logo.getAttribute("data-dark");
        const lightSrc = logo.getAttribute("data-light");
        logo.src = theme === "light" ? lightSrc : darkSrc;
      });
    }
  </script>

  <script>
    const micBtn = document.getElementById("micBtn");
    const loader = document.getElementById("loader");
    const chatbox = document.querySelector(".chatbox");
    const sendBtn1 = document.getElementById("sendBtn");

    let recognition = null;
    let isRecording = false;

    // --- Show send button only if input has text ---
    chatbox.addEventListener("input", () => {
      if (chatbox.value.trim() !== "") {
        sendBtn1.style.display = "inline-block";
        micBtn.style.display = "none"; // hide mic when typing
      } else {
        sendBtn1.style.display = "none";
        micBtn.style.display = "inline-block"; // show mic if empty
      }
    });

    if ("webkitSpeechRecognition" in window || "SpeechRecognition" in window) {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SpeechRecognition();
      recognition.continuous = false;
      recognition.interimResults = false;
      recognition.lang = "en-US";

      recognition.onstart = () => {
        isRecording = true;
        micBtn.style.display = "none";
        loader.style.display = "flex";
        chatbox.placeholder = "Listening... Speak your mind now...";
      };

      recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript;
        chatbox.value = transcript;
        chatbox.placeholder = "Ask anything";
        sendBtn1.style.display = transcript.trim() ? "inline-block" : "none";
        
        // Auto-expand textarea height
        chatbox.style.height = "20px";
        chatbox.style.height = Math.min(chatbox.scrollHeight, 120) + "px";

      recognition.onerror = (event) => {

    // --- Speech Synthesis (TTS) Helper ---
    let currentSpeechUtterance = null;
    let preferredVoice = null;

    function initSpeechSynthesis() {
      if (!window.speechSynthesis) return;
      
      const loadVoices = () => {
        const voices = window.speechSynthesis.getVoices();
        // Specifically prioritize Microsoft David - English (United States) (en-US)
        preferredVoice = voices.find(v => v.name.includes('Microsoft David')) ||
                         voices.find(v => v.lang.startsWith('en') && /david/i.test(v.name)) ||
                         voices.find(v => v.lang.startsWith('en') && /male/i.test(v.name)) ||
                         voices.find(v => v.lang.startsWith('en') && /mark/i.test(v.name)) ||
                         voices.find(v => v.lang.startsWith('en')) ||
                         voices[0];
      };

      loadVoices();
      if (window.speechSynthesis.onvoiceschanged !== undefined) {
        window.speechSynthesis.onvoiceschanged = loadVoices;
      }
    }

    function speakAnswer(text) {
      if (!window.speechSynthesis) return;
      
      // Cancel any ongoing speaking
      window.speechSynthesis.cancel();

      // Clean HTML and markdown tags before reading
      const cleanText = text.replace(/<[^>]*>/g, '').replace(/[\*\_~`#]/g, '');
      if (!cleanText.trim()) return;

      currentSpeechUtterance = new SpeechSynthesisUtterance(cleanText);
      if (preferredVoice) {
        currentSpeechUtterance.voice = preferredVoice;
      }
      currentSpeechUtterance.rate = 1.05; // Slightly faster for natural reading flow
      currentSpeechUtterance.pitch = 1.0;

      currentSpeechUtterance.onstart = () => {
        if (bgVideo) {
          bgVideo.src = 'essentials/talk.mp4';
          bgVideo.load();

          bgVideo.src = 'essentials/idle.mp4';
          bgVideo.load();
          bgVideo.play().catch(e => console.log("Video playback error:", e));
        }
      };

      currentSpeechUtterance.onend = restoreIdle;
      currentSpeechUtterance.onerror = restoreIdle;

      window.speechSynthesis.speak(currentSpeechUtterance);

    initSpeechSynthesis();

IMPORTANT: ONLY suggest a tool IF AND ONLY IF the user expresses a direct need for it (e.g., they specifically say they are panicked, lonely, or want to play a game). DO NOT append links to general conversation, greetings, or casual talk.
If no tool is relevant, do NOT output any placeholders, comments, brackets, or notes like "[No tool suggested]". Simply reply with the natural message.
If they do need a tool, append exactly ONE of these at the end:
- Panicked/Hyperventilating -> [LINK: breathing.html | Text: Guided Breathing]
- Sad/Want to write -> [LINK: journal.html | Text: Open Journal]

### 4. RESPONSE FORMATTING:

User Question: ${text}`;

      try {

        let extracted;
        if (attachedImages.length > 0) {

          // Reset attached files
          attachedImages = [];
          const previewContainer = document.getElementById('previewContainer');
          if (previewContainer) previewContainer.innerHTML = '';
        } else {
          extracted = await callGroqChat(systemPrompt);
        }

        // Replace loader with actual formatted text
        loaderBubble.innerHTML = formatAIText(extracted);

        // Auto-read response via TTS
        speakAnswer(extracted);
      } catch (err) {
        loaderBubble.innerHTML = `<div class="ai-response-error">Connection Error: ${escapeHtml(err.message)}</div>`;
        console.error('Study Assistant API Error:', err);

    function updateLayout() {

  <script>
    (function () {
      const headArea = document.getElementById('headArea');   // large interactive zone
      const cardWrap = document.getElementById('cardWrap');   // the visible head (happy eyes)
      const card = document.getElementById('card');
      const eyes = document.getElementById('eyesNormal');

      // Config (tweak as needed)
      const MAX_ROT_X = 14;    // degrees
      const MAX_ROT_Y = 18;    // degrees
      const LERP = 0.14;       // smoothing (0..1)
      const EYE_MOVE_X = 9;    // px
      const EYE_MOVE_Y = 6;    // px
      let translateZ = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--translateY')) || 45;

      // State
      let targetRotX = 0, targetRotY = 0;
      let currentRotX = 0, currentRotY = 0;
      let targetEyeX = 0, targetEyeY = 0;
      let currentEyeX = 0, currentEyeY = 0;

      // This flag is toggled from the carousel updateLayout via the element class (card-hidden)
      function isCardActive() {
        return !(cardWrap && cardWrap.classList.contains('card-hidden'));
      }

      function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
      function lerp(a, b, t) { return a + (b - a) * t; }

      // Map pointer pos inside headArea to rotations & eye offsets
      function handlePointerMove(clientX, clientY) {
        if (!isCardActive()) return; // freeze when card inactive

        const rect = headArea.getBoundingClientRect();
        const cx = rect.left + rect.width / 2;
        const cy = rect.top + rect.height / 2;

        const nx = (clientX - cx) / (rect.width / 2);  // -1..1
        const ny = (clientY - cy) / (rect.height / 2); // -1..1

        const sx = clamp(nx, -1, 1);
        const sy = clamp(ny, -1, 1);

        // rotate toward pointer: right => positive Y rotation; down => negative X rotation
        targetRotY = sx * MAX_ROT_Y;
        targetRotX = -sy * MAX_ROT_X;

        // eyes move toward pointer
        targetEyeX = sx * EYE_MOVE_X;
        targetEyeY = sy * EYE_MOVE_Y;
      }

      // HEAD AREA handlers: control tilt + eye-parallax only
      function onHeadMove(e) {
        if (e.touches && e.touches[0]) handlePointerMove(e.touches[0].clientX, e.touches[0].clientY);
        else handlePointerMove(e.clientX, e.clientY);
      }
      function onHeadLeave() {
        // reset targets when pointer leaves the head area
        targetRotX = 0; targetRotY = 0;
        targetEyeX = 0; targetEyeY = 0;
      }

      // CARD handlers: control happy eyes + pause balls/glow (only when pointer actually on the head)
      function onCardEnter() { if (!isCardActive()) return; cardWrap.classList.add('is-hovered'); }
      function onCardLeave() { if (!isCardActive()) return; cardWrap.classList.remove('is-hovered'); }

      // Animation loop: smooth rotation + eyes parallax
      function animate() {
        // If card not active, smoothly lerp rotation/eye targets to zero (freeze)
        if (!isCardActive()) {
          targetRotX = 0; targetRotY = 0;
          targetEyeX = 0; targetEyeY = 0;
        }

        currentRotX = lerp(currentRotX, targetRotX, LERP);
        currentRotY = lerp(currentRotY, targetRotY, LERP);

        const perspectiveVal = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--perspective')) || 1000;
        if (card) {
          card.style.transform = `perspective(${perspectiveVal}px) rotateX(${currentRotX.toFixed(3)}deg) rotateY(${currentRotY.toFixed(3)}deg) translateZ(${translateZ}px)`;
        }

        currentEyeX = lerp(currentEyeX, targetEyeX, LERP * 1.2);
        currentEyeY = lerp(currentEyeY, targetEyeY, LERP * 1.2);
        if (eyes) {
          eyes.style.transform = `translateX(calc(-50% + ${currentEyeX.toFixed(2)}px)) translateY(${currentEyeY.toFixed(2)}px)`;
        }

        requestAnimationFrame(animate);
      }

      // Attach listeners to the single headArea:
      if (headArea) {
        headArea.addEventListener('mousemove', onHeadMove, { passive: true });
        headArea.addEventListener('touchmove', onHeadMove, { passive: true });
        headArea.addEventListener('mouseleave', onHeadLeave, { passive: true });
        headArea.addEventListener('touchend', onHeadLeave, { passive: true });
      }

      // Card only toggles the happy eyes / paused balls  handlers check active flag
      if (cardWrap) {
        cardWrap.addEventListener('mouseenter', onCardEnter, { passive: true });
        cardWrap.addEventListener('mouseleave', onCardLeave, { passive: true });
        cardWrap.addEventListener('touchstart', function (e) { onCardEnter(); onHeadMove(e); }, { passive: true });
        cardWrap.addEventListener('touchend', onCardLeave, { passive: true });
      }

      // Responsive depth tweak
      function updateResponsive() {
        if (window.innerWidth < 520) translateZ = 35;
        else translateZ = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--translateY')) || 45;
      }
      window.addEventListener('resize', updateResponsive);
      updateResponsive();

      requestAnimationFrame(animate);
    })();
  </script>

  <script>
    (function () {
      const logoBtn = document.getElementById('logoBtn');
      const dropdown = document.getElementById('logoDropdown');
      const themeBtn = document.getElementById('themeBtn');
      const themeIcon = document.getElementById('themeIcon');

      // Open
      function openDropdown() {
        dropdown.classList.add('pdd-visible');
        logoBtn.setAttribute('aria-expanded', 'true');
        // Move focus to first interactive item for keyboard users
        const first = dropdown.querySelector('[role="menuitem"]');
        if (first) first.focus();
      }

      // Close
      function closeDropdown() {
        dropdown.classList.remove('pdd-visible');
        logoBtn.setAttribute('aria-expanded', 'false');
        logoBtn.focus();
      }

      // Toggle
      function toggleDropdown() {
        if (dropdown.classList.contains('pdd-visible')) closeDropdown(); else openDropdown();
      }

      // Click on logo toggles dropdown
      if (logoBtn) {
        logoBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          toggleDropdown();
        });

        // Keyboard: open via Enter/Space when focused on logo
        logoBtn.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            logoBtn.click();
          }
        });
      }

      // Close on outside click
      document.addEventListener('click', (e) => {
        if (dropdown && !dropdown.classList.contains('pdd-visible')) return;
        if (dropdown && !dropdown.contains(e.target) && e.target !== logoBtn) closeDropdown();
      });

      // Close on Escape and support keyboard navigation
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          if (dropdown && dropdown.classList.contains('pdd-visible')) closeDropdown();
        } else if (e.key === 'Tab' && dropdown && dropdown.classList.contains('pdd-visible')) {
          // If Tabbed out of the menu (focus not inside dropdown nor logo), close it
          // Use a small timeout to allow focus to change
          setTimeout(() => {
            const active = document.activeElement;
            if (dropdown && !dropdown.contains(active) && active !== logoBtn) closeDropdown();
          }, 10);
        }
      });

      // Allow clicking/pressing any row to close the dropdown (common UX)
      if (dropdown) {
        dropdown.addEventListener('click', (e) => {
          const row = e.target.closest('[role="menuitem"]');
          if (row && row.tagName.toLowerCase() === 'a') {
            // for anchor links, allow default navigation but close the menu
            closeDropdown();
          }
        });
      }

      // Simple theme icon toggle (no global theme changes)
      function toggleThemeIcon() {
        if (!themeIcon || !themeBtn) return;
        const isSun = themeIcon.textContent.trim() === 'wb_sunny';
        themeIcon.textContent = isSun ? 'dark_mode' : 'wb_sunny';
        themeBtn.setAttribute('aria-pressed', String(!isSun));
      }
      
      if (themeBtn) {
        themeBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          toggleThemeIcon();
        });
      }

      // Accessibility: allow Enter/Space to activate any menuitem (div/button/a with role=menuitem)
      if (dropdown) {
        dropdown.addEventListener('keydown', (e) => {
          const target = e.target;
          if ((e.key === 'Enter' || e.key === ' ') && target.getAttribute('role') === 'menuitem') {
            e.preventDefault();
            // if it's an anchor, follow it; if button-like, trigger click
            if (target.tagName.toLowerCase() === 'a') {
              target.click();
            } else {
              target.querySelector('button')?.click();
            }
          }
        });
      }

      // Ensure dropdown closes on window blur (optional, helps mobile)
      window.addEventListener('blur', () => {
        if (dropdown && dropdown.classList.contains('pdd-visible')) closeDropdown();
      });

      // Expose for debugging if needed
      window._logoDropdown = { open: openDropdown, close: closeDropdown, toggle: toggleDropdown };
    })();
  </script>

            ui.remove();
            const item = document.createElement('div');
            item.className = 'preview-item';
            const img = document.createElement('img');
            img.src = imageUrl;
            
            const removeBtn = document.createElement('div');
            removeBtn.className = 'remove-btn';
            removeBtn.innerHTML = '&times;';
            removeBtn.onclick = () => item.remove();
            
            item.appendChild(img);
            item.appendChild(removeBtn);
            previewContainer.appendChild(item);
          } catch (err) {
            genBtn.innerHTML = 'Failed — Retry';
            genBtn.disabled = false;
            console.error('HF Image Gen Error:', err);
          }
        };

        controls.appendChild(closeBtn);
        controls.appendChild(genBtn);
        ui.appendChild(input);
        ui.appendChild(controls);
        
        previewContainer.appendChild(ui);
        
        // Focus the input
        setTimeout(() => input.focus(), 100);
        
        // Close menu
        if (popupMenu) popupMenu.style.display = 'none';
      });
    }
  });
  </script>
</body>

</html>
